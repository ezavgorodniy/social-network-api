services:
  db:
    image: postgres:18-alpine
    container_name: social-network-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: social_network
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 moved PGDATA under /var/lib/postgresql/<major>/docker and
      # declares the volume at /var/lib/postgresql (not .../data as in <=17).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d social_network"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
